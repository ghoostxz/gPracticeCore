# ===== gCelestialPracticeCore =====
prefix: "&b&lgCelestial &8» &7"

# Gamemode do jogador: no lobby (ao entrar no servidor / voltar do duelo) e durante a batalha.
gamemode:
  lobby: ADVENTURE
  duel: SURVIVAL

duel:
  # Mundo (vazio, criado automaticamente) onde as arenas sao coladas
  world: "practice_arenas"
  paste-y: 100
  # Distancia em blocos (eixo X) entre uma arena e outra
  slot-spacing: 1000
  rounds-to-win: 3
  countdown-seconds: 3
  # Ticks entre um ponto e o inicio do proximo round (20 ticks = 1s)
  round-delay-ticks: 40
  # Ticks entre o fim do duelo e a volta ao spawn
  end-delay-ticks: 60

ranked:
  start-points: 0
  # Cada rank = X pontos (LT5 = 0-99, HT5 = 100-199 ... HT1 = 900+)
  points-per-rank: 100
  win-points: 25
  loss-points: 20
  # Diferenca maxima de pontos para parear no inicio
  max-point-diff: 100
  # A cada X segundos na fila a diferenca aceita aumenta em expand-step
  expand-every-seconds: 10
  expand-step: 50

# Posicao de cada item na hotbar ao entrar: slot de 0 (primeiro) a 8 (ultimo).
# Depois de mudar, use /gcpc reload para aplicar nos jogadores online.
hotbar:
  unranked:
    slot: 0
    material: STONE_SWORD
    name: "&aFila Normal &7(Clique direito)"
    lore:
      - "&7Entre numa fila sem ranking."
  ranked:
    slot: 1
    material: IRON_SWORD
    name: "&6Fila Ranqueada &7(Clique direito)"
    lore:
      - "&7Ganhe e perca pontos de rank."
  party:
    slot: 2
    material: NETHER_STAR
    name: "&dParty &7(Clique direito)"
    lore:
      - "&7Crie uma party, convide amigos"
      - "&7e entrem juntos nas filas."
  kit-editor:
    slot: 3
    material: ANVIL
    name: "&bEditar Layout do Kit &7(Clique direito)"
    lore:
      - "&7Reorganize a hotbar e o inventario"
      - "&7de cada modo do jeito que preferir."
  # Itens que aparecem so quando necessario:
  # - leave-queue: enquanto o jogador esta em qualquer fila
  # - party-disband: para o LIDER enquanto esta numa party (destroi a party)
  # - party-leave: para os MEMBROS enquanto estao numa party
  party-disband:
    slot: 7
    material: BARRIER
    name: "&4Destruir Party &7(Clique direito)"
    lore:
      - "&7Desfaz a party e remove todos."
  party-leave:
    slot: 7
    material: ORANGE_DYE
    name: "&6Sair da Party &7(Clique direito)"
    lore:
      - "&7Voce deixa a party."
  leave-queue:
    slot: 8
    material: RED_DYE
    name: "&cSair da fila"
    lore:
      - "&7Clique direito para sair da fila."

# /lobby: tira o jogador da fila e leva ao lobby da rede.
lobby:
  # COMMAND = executa o comando abaixo como se o jogador o digitasse (ex.: "queue lobby")
  # CONNECT = envia direto ao servidor "server" pelo canal BungeeCord (Velocity)
  type: COMMAND
  command: "queue lobby"
  server: "lobby"
  # true = nao permite usar /lobby durante um duelo
  block-in-duel: true

# Comandos de links: /discord (/dc), /site e /loja.
# Troque a "url" e o texto em "message" (use {url} para inserir o link).
# Clicar em qualquer linha da mensagem abre o link (so funciona se a url comecar com http:// ou https://).
# /duelo <jogador>: desafio 1v1 (sem ranking) escolhendo a modalidade
challenge:
  expire-seconds: 30

links:
  discord:
    url: "https://discord.gg/seulink"
    message:
      - ""
      - "&9&lDISCORD"
      - "&7Entre na nossa comunidade: &b{url}"
      - ""
  site:
    url: "https://seusite.com.br"
    message:
      - ""
      - "&a&lSITE"
      - "&7Acesse nosso site: &b{url}"
      - ""
  loja:
    url: "https://loja.seusite.com.br"
    message:
      - ""
      - "&6&lLOJA"
      - "&7Adquira vips e vantagens: &b{url}"
      - ""

party:
  # Maximo de membros por party
  max-size: 4
  # true = novas parties ja nascem publicas (qualquer um entra)
  default-public: false
  invite-expire-seconds: 60
  # Em 1v1, party com mais membros que isso nao pode entrar na fila.
  # Party de 2 em 1v1 = os dois lutam entre si (somente fila normal).
  max-solo-party: 2
  # false = quem esta em party (mesmo sozinho nela) nao pode entrar na fila ranqueada.
  # true = party pode jogar ranqueado (exceto 1v1, que continua bloqueado para party).
  allow-ranked: false

menu:
  unranked-title: "&aFila Normal"
  ranked-title: "&6Fila Ranqueada"
  party-title: "&8Party"
  challenge-title: "&8Desafiar {player}"
  layout-title: "&8Editar layout do kit"
  layout-editor-title: "&8Layout: {mode}"
  size-title: "&8{mode} &8- Escolha o formato"

# Formatos exibidos ao clicar num modo (size = jogadores por time, maximo 4 exibidos)
sizes:
  solo:
    size: 1
    name: "&aSolo &7(1v1)"
    icon: IRON_SWORD
  dupla:
    size: 2
    name: "&bDupla &7(2v2)"
    icon: DIAMOND_SWORD
  trio:
    size: 3
    name: "&dTrio &7(3v3)"
    icon: GOLDEN_SWORD
  quarteto:
    size: 4
    name: "&6Quarteto &7(4v4)"
    icon: NETHERITE_SWORD

# Modos. A chave (sword, crystal_hole...) e o nome da pasta em plugins/gCelestialPracticeCore/arenas/<chave>
modes:
  sword:
    name: "&fSword"
    icon: DIAMOND_SWORD
  crystal_hole:
    name: "&dCrystal Hole"
    icon: END_CRYSTAL
  crystal_flat:
    name: "&5Crystal Flat"
    icon: OBSIDIAN
  mace:
    name: "&7Mace"
    icon: MACE
  spear_mace:
    name: "&6Spear e Mace"
    icon: TRIDENT
  netherite_pot:
    name: "&8Netherite Pot"
    icon: SPLASH_POTION
  uhc:
    name: "&eUHC"
    icon: GOLDEN_APPLE

